<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Age & Emotion Estimator</title>
    
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, sans-serif;
        }
        h2 {
            margin: 0 0 16px 0;
            color: #4CAF50;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 540px;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.95rem;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 16px 20px;
            border-radius: 8px;
            width: 80%;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <h2>Live Age & Emotion Estimator</h2>
    
    <div id="container">
        <div id="status">Waiting for page to load...</div>
        <video id="video" autoplay muted playsinline></video>
    </div>

    <script>
        window.onload = async () => {
            const video = document.getElementById('video');
            const statusText = document.getElementById('status');
            const MODEL_URL = 'https://vladmandic.github.io/face-api/model/';

            // Array to store recent age calculations for smoothing
            let ageHistory = [];

            try {
                statusText.innerHTML = "Downloading AI Models...";
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL);
                await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
                
                statusText.innerHTML = "Requesting camera access...";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;

            } catch (error) {
                console.error(error);
                statusText.innerHTML = `<span style="color:#ff5252; font-weight:bold;">Error: ${error.message}</span>`;
            }

            video.addEventListener('playing', () => {
                statusText.style.display = 'none';

                let canvas = document.querySelector('canvas');
                if (!canvas) {
                    canvas = faceapi.createCanvasFromMedia(video);
                    document.getElementById('container').append(canvas);
                }

                const updateDisplaySize = () => {
                    const displaySize = { width: video.offsetWidth, height: video.offsetHeight };
                    faceapi.matchDimensions(canvas, displaySize);
                    return displaySize;
                };

                let displaySize = updateDisplaySize();
                window.addEventListener('resize', () => { displaySize = updateDisplaySize(); });

                setInterval(async () => {
                    if (video.paused || video.ended) return;

                    // OPTIMIZATION 1: detectSingleFace instead of detectAllFaces
                    // OPTIMIZATION 2: Increased scoreThreshold to 0.65 to ignore background noise
                    const detection = await faceapi.detectSingleFace(
                        video, 
                        new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.65 })
                    ).withAgeAndGender().withFaceExpressions();

                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    if (detection) {
                        const resizedDetection = faceapi.resizeResults(detection, displaySize);
                        
                        // OPTIMIZATION 3: Age smoothing (averages the last 15 frames)
                        ageHistory.push(resizedDetection.age);
                        if (ageHistory.length > 15) ageHistory.shift();
                        const smoothedAge = Math.round(ageHistory.reduce((a, b) => a + b) / ageHistory.length);

                        const expressions = resizedDetection.expressions;
                        const highestExpression = Object.keys(expressions).reduce((a, b) => 
                            expressions[a] > expressions[b] ? a : b
                        );
                        
                        const emotionFormat = highestExpression.charAt(0).toUpperCase() + highestExpression.slice(1);
                        const text = `${smoothedAge} yrs | ${emotionFormat}`;
                        
                        // OPTIMIZATION 4: Removed default drawDetections to stop duplicate blue boxes
                        const drawBox = new faceapi.draw.DrawBox(resizedDetection.detection.box, { 
                            label: text,
                            boxColor: '#4CAF50',
                            drawLabelOptions: { fontSize: 16, fontColor: '#ffffff' }
                        });
                        drawBox.draw(canvas);
                    } else {
                        // Clear age history if the face leaves the screen
                        ageHistory = [];
                    }
                }, 100);
            });
        };
    </script>
</body>
</html>
