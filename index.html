<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age & Emotion Estimator</title>
    
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
        }
        #container {
            position: relative;
            width: 720px;
            height: 560px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            z-index: 10;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h2 style="color: #4CAF50;">Live Age & Emotion Estimator</h2>
    
    <div id="container">
        <div id="status">Waiting for page to load...</div>
        <video id="video" width="720" height="560" autoplay muted playsinline></video>
    </div>

    <script>
        window.onload = async () => {
            const video = document.getElementById('video');
            const statusText = document.getElementById('status');
            
            const MODEL_URL = 'https://vladmandic.github.io/face-api/model/';

            try {
                statusText.innerHTML = "Downloading AI Models...<br><small>(Loading Age, Gender, and Emotion networks)</small>";
                
                // 1. Load the new Expression model alongside the others
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL);
                await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL); 
                
                statusText.innerHTML = "Models Loaded! Requesting camera permission...";
                
                const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
                video.srcObject = stream;

            } catch (error) {
                console.error(error);
                statusText.innerHTML = `<span style="color:#ff4444; font-weight:bold;">Error: ${error.message}</span>`;
            }

            video.addEventListener('play', () => {
                statusText.style.display = 'none';

                const canvas = faceapi.createCanvasFromMedia(video);
                document.getElementById('container').append(canvas);
                
                const displaySize = { width: video.width, height: video.height };
                faceapi.matchDimensions(canvas, displaySize);

                setInterval(async () => {
                    // 2. Add .withFaceExpressions() to the detection chain
                    const detections = await faceapi.detectAllFaces(
                        video, 
                        new faceapi.TinyFaceDetectorOptions()
                    ).withAgeAndGender().withFaceExpressions();

                    const resizedDetections = faceapi.resizeResults(detections, displaySize);
                    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                    
                    faceapi.draw.drawDetections(canvas, resizedDetections);
                    
                    resizedDetections.forEach(detection => {
                        const box = detection.detection.box;
                        
                        // 3. Find the emotion with the highest probability score
                        const expressions = detection.expressions;
                        const highestExpression = Object.keys(expressions).reduce((a, b) => expressions[a] > expressions[b] ? a : b);
                        
                        // Capitalize the first letter of the emotion
                        const emotionFormat = highestExpression.charAt(0).toUpperCase() + highestExpression.slice(1);
                        
                        // Combine Age and Emotion into one label
                        const text = `${Math.round(detection.age)} yrs | ${emotionFormat}`;
                        const drawBox = new faceapi.draw.DrawBox(box, { label: text });
                        drawBox.draw(canvas);
                    });
                }, 100);
            });
        };
    </script>
</body>
</html>
